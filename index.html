<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>App Icon Design</title>

  <!-- CSS -->

  <link rel="stylesheet"
    href="style.css">

  <!-- Font Awesome -->

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font -->

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link href=
"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

</head>

<body>

  <!-- Container -->

  <section class="container">

    <!-- Heading -->

    <div class="header">

      <h1>
        App Icon Design
      </h1>

      <p>
        Modern mobile application
        icon concept design
      </p>

    </div>

    <!-- Icon Grid -->

    <div class="icon-grid">

      <!-- Icon 1 -->

      <div class="icon-card">

        <div class="icon blue">

          <i class="fa-solid fa-bolt"></i>

        </div>

        <h2>
          Nova
        </h2>

      </div>

      <!-- Icon 2 -->

      <div class="icon-card">

        <div class="icon purple">

          <i class="fa-solid fa-music"></i>

        </div>

        <h2>
          MusicX
        </h2>

      </div>

      <!-- Icon 3 -->

      <div class="icon-card">

        <div class="icon pink">

          <i class="fa-solid fa-camera"></i>

        </div>

        <h2>
          SnapGo
        </h2>

      </div>

      <!-- Icon 4 -->

      <div class="icon-card">

        <div class="icon orange">

          <i class="fa-solid fa-gamepad"></i>

        </div>

        <h2>
          PlayX
        </h2>

      </div>

    </div>

  </section>

  <!-- JavaScript -->

  <script src="script.js"></script>

</body>

</html>
